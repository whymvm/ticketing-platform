# Continuous integration: builds, tests and validates every change before it reaches develop or main.
# Gitflow: feature/* opens pull requests to develop; release/* and hotfix/* merge into main and develop.
# Base generated with the Bancolombia scaffold task `./gradlew gpl --type=github`, then hardened following the
# GitHub Actions security guide (least-privilege token, actions pinned to full commit SHAs) and DORA CI practices
# (fast feedback on every change, reliable tests, visible results).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
  workflow_dispatch:

# Read-only token by default; no job needs to write to the repository.
permissions:
  contents: read

# A new push to the same pull request or branch cancels the run that is now outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Detects which parts of the project exist, so optional jobs are skipped instead of failing.
  scope:
    name: Detect project parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.detect.outputs.terraform }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Terraform and Docker Compose
        id: detect
        run: |
          echo "terraform=$([ -d infra/terraform ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([ -f docker-compose.yml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repository variable. Leave it unset to only report coverage; set it (e.g. 90) to fail below that value.
      MIN_LINE_COVERAGE: ${{ vars.MIN_LINE_COVERAGE }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle dependencies and validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compiles, validates the Clean Architecture structure and runs the unit tests.
      # Mutation tests (pitest) are excluded to keep feedback under 10 minutes; they can run on demand.
      - name: Build and run the tests
        run: ./gradlew build -x pitest

      - name: Check line coverage
        if: success() || failure()
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys

          missed = covered = 0
          for report in glob.glob("**/build/reports/jacoco.xml", recursive=True):
              counters = re.findall(r'<counter type="LINE" missed="(\d+)" covered="(\d+)"/>', open(report).read())
              if counters:
                  missed += int(counters[-1][0])
                  covered += int(counters[-1][1])

          if missed + covered == 0:
              sys.exit("No coverage reports were found")

          coverage = covered / (missed + covered) * 100
          minimum = os.environ.get("MIN_LINE_COVERAGE") or "0"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Line coverage: {coverage:.1f}% (minimum: {minimum}%)\n")
          print(f"Line coverage: {coverage:.1f}% (minimum: {minimum}%)")
          if coverage < float(minimum):
              sys.exit(f"Line coverage {coverage:.1f}% is below the minimum of {minimum}%")
          EOF

      - name: Upload test and coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacocoHtml/
            **/build/reports/jacoco.xml
          retention-days: 7

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: needs.scope.outputs.terraform == 'true'
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate the local environment
        working-directory: infra/terraform/envs/local
        run: |
          terraform init -backend=false -input=false
          terraform validate

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope, build]
    if: needs.scope.outputs.docker == 'true'
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the application image and starts LocalStack, Terraform and the application.
      - name: Start the local stack
        run: docker compose up --build --detach

      - name: Wait for the application to be healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet app)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              echo "The application is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done
          echo "The application did not become healthy"
          docker compose ps
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Runs the Postman collection against the running application.
      - name: Run the API tests
        run: npx --yes newman@6.2.1 run postman/ticketing-platform.postman_collection.json

      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the local stack
        if: always()
        run: docker compose down --volumes
