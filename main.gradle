apply plugin: 'base'
apply plugin: 'info.solidsoft.pitest.aggregator'

allprojects {
    repositories {
        //mavenLocal()
        mavenCentral()
    }

    // Force dependency versions to address reported vulnerabilities.
    configurations.configureEach {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-core') {
                details.useVersion("2.22.3")
            }
            if (details.requested.group == 'tools.jackson.core' && details.requested.name == 'jackson-core') {
                details.useVersion("3.2.3")
            }
        }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'info.solidsoft.pitest'

    compileJava.dependsOn validateStructure

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    //build.dependsOn 'pitest'

    test {
        useJUnitPlatform()
    }

    dependencies {
		implementation platform('software.amazon.awssdk:bom:2.55.11')
        implementation 'io.projectreactor:reactor-core'
        implementation 'io.projectreactor.addons:reactor-extra'

        testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockHoundVersion}"

        testImplementation 'io.projectreactor:reactor-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        pitest "org.pitest:pitest-history-plugin:${pitestHistoryVersion}"
    }

    // Remove once it has been updated in Spring Boot
    ext['jackson-2-bom.version'] = "2.22.3"
    ext['jackson-bom.version'] = "3.2.3"

    tasks.withType(Test).configureEach {
        if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_13)) {
            jvmArgs += [
                    "-XX:+AllowRedefinitionToAddDeleteMethods"
            ]
        }
    }

    test.finalizedBy(project.tasks.jacocoTestReport)

    pitest {
        targetClasses = ['co.com.ticketing.*']
        excludedClasses = []
        excludedTestClasses = []
        pitestVersion = '1.30.0'
        verbose = false
        outputFormats = ['XML', 'HTML']
        threads = Runtime.runtime.availableProcessors()
        exportLineCoverage = true
        useClasspathFile = true
        withHistory = true
        timestampedReports = false
        //mutators = ['STRONGER', 'DEFAULTS']
        fileExtensionsToFilter.addAll('xml', 'orbit')
        junit5PluginVersion = '1.2.3'
        failWhenNoMutations = false
        jvmArgs = ["-XX:+AllowRedefinitionToAddDeleteMethods"]
    }

    // Mutation testing is slow, so it only runs when it is asked for (./gradlew mutationTest)
    jacocoTestReport {
        dependsOn test
        reports {
            xml.setRequired true
            xml.setOutputLocation layout.buildDirectory.file("reports/jacoco.xml")
            csv.setRequired false
            html.setOutputLocation layout.buildDirectory.dir("reports/jacocoHtml")
        }
    }

}

jacoco {
    toolVersion = "${jacocoVersion}"
    reportsDirectory.set(layout.buildDirectory.dir("reports"))
}

tasks.register('jacocoMergedReport', JacocoReport) {
    dependsOn = [test, subprojects.jacocoTestReport, pitestReportAggregate]
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom project.fileTree(dir: '.', include: '**/build/jacoco/test.exec')
    reports {
        xml.setRequired true
        csv.setRequired false
        html.setRequired true
    }
}

// Line coverage of the whole project (every module together), the figure the technical test asks for. Some modules
// are almost only configuration (MainApplication, for example), so the rule applies to the total, not per module.
def coverageModules = subprojects.findAll { it.file('src/test').exists() || it.file('src/main').exists() }
def coverageExecutionData = files(coverageModules.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
        .filter { it.exists() }
def coverageSources = files(coverageModules.collect { it.sourceSets.main.allSource.srcDirs })
def coverageClasses = files(coverageModules.collect { it.sourceSets.main.output })
def minimumLineCoverage = providers.gradleProperty('minLineCoverage').map { new BigDecimal(it) }

tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Builds the coverage report of the whole project (HTML and XML).'
    dependsOn coverageModules.collect { it.tasks.named('test') }
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSources)
    classDirectories.from(coverageClasses)
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/coverage/coverage.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/coverage/html')
        csv.required = false
    }
}

tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails the build when the line coverage of the whole project is below minLineCoverage (gradle.properties).'
    dependsOn coverageModules.collect { it.tasks.named('test') }
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSources)
    classDirectories.from(coverageClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = minimumLineCoverage.get()
            }
        }
    }
}

// ./gradlew build (and check) fails below the minimum coverage
tasks.named('check') {
    dependsOn 'coverageVerification'
}

apply from: 'gradle/dev-tasks.gradle'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

pitestReportAggregate {
    def rootReportDir = layout.buildDirectory.dir("reports/pitest")
    def subprojectReports = subprojects.collect { subproject ->
        subproject.layout.buildDirectory.file("reports/pitest/mutations.xml")
    }

    doLast {
        def reportDir = rootReportDir.get().asFile
        def consolidatedReport = new File(reportDir, 'mutations.xml')
        consolidatedReport.withWriter { writer ->
            writer.write("<mutations>\n")
            subprojectReports.each { reportProvider ->
                def xmlReport = reportProvider.get().asFile
                if (xmlReport.exists()) {
                    def xmlContent = xmlReport.text
                    xmlContent = xmlContent.replaceAll("<\\?xml[^>]*>", "")
                    xmlContent = xmlContent.replaceAll("</?mutations( partial=\"true\")?>", "")
                    writer.write(xmlContent.trim() + "\n")
                }
            }
            writer.write("</mutations>")
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.0'
}